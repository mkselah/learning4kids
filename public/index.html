<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header><h1 id="title">Dashboard</h1></header>
  <section class="controls row">
    <select id="tabSelect"></select>
    <button id="reloadBtn">↻ Refresh</button>
    <label>Filter <select id="filterCol"></select> <select id="filterVal"></select></label>
    <span id="status"></span>
  </section>
  <section id="kpis" class="kpis"></section>
  <main id="sections"></main>
  <details class="panel">
    <summary>📋 Data</summary>
    <p id="tableNote"></p>
    <div class="table-wrap"><table id="dataTable"></table></div>
  </details>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="app.js"></script>
</body>
</html>
