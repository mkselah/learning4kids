<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 id="title">Dashboard</h1>
    <nav id="sourceSwitch" class="switch">
      <button data-source="weekly">Weekly</button>
      <button data-source="monthly">Monthly</button>
    </nav>
  </header>
  <section class="controls row">
    <button id="reloadBtn">↻ Refresh</button>
    <div id="filters" class="row"></div>
    <span id="status"></span>
  </section>
  <section id="kpis" class="kpis"></section>
  <section id="latest" hidden></section>
  <main id="sections"></main>
  <details class="panel">
    <summary>📋 Data</summary>
    <p id="tableNote"></p>
    <div class="table-wrap"><table id="dataTable"></table></div>
  </details>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="app.js"></script>
</body>
</html>
