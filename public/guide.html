<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill guide</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="guide.css" />
</head>
<body>
  <header>
    <h1 id="pageTitle">Skill guide</h1>
    <div class="row">
      <nav id="modeSwitch" class="switch">
        <button data-mode="weekly">Weekly</button>
        <button data-mode="monthly">Monthly</button>
      </nav>
      <a id="backLink" class="nav-link" href="/">← Dashboard</a>
    </div>
  </header>
  <div class="picker">
    <button id="prevBtn" aria-label="Previous skill">‹</button>
    <select id="skill" aria-label="Skill"></select>
    <button id="nextBtn" aria-label="Next skill">›</button>
  </div>
  <main id="guide" class="guide"></main>
  <script src="guide.js"></script>
</body>
</html>
